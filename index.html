    <script>
      (function () {
        var isExtNoise = function (a, b, c) {
          var s = String(a || '') + ' ' + String(b || '') + ' ' + String(c || '');
          return (
            s.indexOf('Failed to connect to MetaMask') !== -1 ||
            s.indexOf('chrome-extension://') !== -1 ||
            s.indexOf('moz-extension://') !== -1 ||
            s.indexOf('safari-extension://') !== -1
          );
        };
        window.addEventListener(
          'error',
          function (e) {
            var stack = e && e.error && e.error.stack ? e.error.stack : '';
            if (isExtNoise(e && e.message, e && e.filename, stack)) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );
        window.addEventListener(
          'unhandledrejection',
          function (e) {
            var r = e ? e.reason : null;
            var msg = typeof r === 'string' ? r : r && r.message ? r.message : '';
            var stack = r && typeof r === 'object' && r.stack ? r.stack : '';
            if (isExtNoise(msg, '', stack)) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );
        var origConsoleError = console.error;
        console.error = function () {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            var text = typeof arg === 'string' ? arg : (arg && (arg.message || arg.stack)) || '';
            if (isExtNoise(text, '', '')) {
              return;
            }
          }
          return origConsoleError.apply(console, arguments);
        };
      })();
    </script>
